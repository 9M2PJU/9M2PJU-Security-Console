<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In - 9M2PJU Security Console</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/favicon.ico?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
<style>
  :root {
    --bg: #0b0f17;
    --panel: #131a26;
    --border: #253044;
    --text: #e6edf7;
    --muted: #8b9bb4;
    --accent: #38bdf8;
    --accent-hover: #0ea5e9;
    --danger-bg: rgba(239, 68, 68, 0.14);
    --danger-border: rgba(239, 68, 68, 0.45);
    --danger-text: #fca5a5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #162238 0%, var(--bg) 60%);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 390px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.45);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  .logo-svg {
    width: 38px;
    height: 38px;
    flex-shrink: 0;
    filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.28));
  }
  h1 {
    font-size: 1.18rem;
    margin: 0;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .sub {
    color: var(--muted);
    font-size: 0.85rem;
    margin: 0 0 22px;
  }
  .err {
    background: var(--danger-bg);
    border: 1px solid var(--danger-border);
    color: var(--danger-text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.85rem;
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 600;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0d131d;
    color: var(--text);
    font-size: 0.95rem;
    margin-bottom: 16px;
    outline: none;
  }
  input:focus {
    border-color: var(--accent);
  }
  button {
    width: 100%;
    padding: 11px 14px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: #07131f;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:hover {
    background: var(--accent-hover);
  }
  .foot {
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    font-size: 0.74rem;
    color: var(--muted);
  }
</style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <div class="brand">
      <svg class="logo-svg" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="lgShield" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="100%" stop-color="#0284c7"/>
          </linearGradient>
        </defs>
        <path d="M32 4L8 14v17c0 14.5 10.2 26.8 24 30 13.8-3.2 24-15.5 24-30V14L32 4z" fill="#0d1829" stroke="url(#lgShield)" stroke-width="3.2"/>
        <path d="M32 10L13 18v13c0 11.4 7.8 21.1 19 24.1 11.2-3 19-12.7 19-24.1V18L32 10z" fill="none" stroke="rgba(56,189,248,0.22)" stroke-width="1.2"/>
        <path d="M21 26a15.5 15.5 0 0 1 22 0" fill="none" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M25.5 30.5a9.2 9.2 0 0 1 13 0" fill="none" stroke="#7dd3fc" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="32" cy="35.5" r="3.6" fill="#22c55e"/>
        <path d="M23.5 43.5l8.5 4.2 8.5-4.2" fill="none" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <h1>9M2PJU Security Console</h1>
        <div style="font-size:0.75rem;color:var(--muted);margin-top:2px;">Threat Telemetry & Access Control</div>
      </div>
    </div>
    <p class="sub" style="margin-top:10px;">Host: {{.Hostname}} (Protected by mTLS)</p>
    {{if .Error}}<div class="err">{{.Error}}</div>{{end}}
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign In</button>
    <div class="foot">
      <span>9M2PJU Security Operations</span>
      <span>TLS + mTLS</span>
    </div>
  </form>
</body>
</html>
